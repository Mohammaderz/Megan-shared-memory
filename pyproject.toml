[project]
name = "megan-ethereum-watcher"
version = "0.1.0"
description = "Observation-only Ethereum token and DEX pool discovery MVP"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.0,<8.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
megan-watch = "megan_watcher:main"
megan-research = "megan_research:main"
megan-holders = "megan_holders:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
py-modules = ["megan_watcher", "trace_discovery", "risk_engine", "public_sources", "megan_research", "lp_analysis", "holder_analysis", "holder_snapshot"]

[tool.setuptools.package-dir]
"" = "src"
