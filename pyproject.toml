[project]
name = "megan-ethereum-watcher"
version = "0.2.0"
description = "Read-only Ethereum meme-coin discovery and social research"
requires-python = ">=3.11"
dependencies = [
  "web3>=7.0,<8.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
telegram = ["telethon>=1.45,<2.0"]

[project.scripts]
megan-run = "megan:main"
megan-watch = "megan_watcher:main"
megan-research = "megan_research:main"
megan-socials = "social_discovery:main"
megan-telegram-login = "telegram_auth:main"
megan-holders = "megan_holders:main"
megan-lp = "megan_lp:main"
megan-deployer = "megan_deployer:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
py-modules = ["megan", "megan_watcher", "trace_discovery", "risk_engine", "public_sources", "megan_research", "social_discovery", "telegram_auth", "lp_analysis", "holder_analysis", "holder_snapshot", "megan_holders", "megan_lp", "deployer_history", "megan_deployer", "v2_locker_registry"]

[tool.setuptools.package-dir]
"" = "src"
