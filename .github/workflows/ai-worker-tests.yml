name: AI Worker tests

on:
  push:
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-tests.yml"
  pull_request:
    paths:
      - "ai-worker/**"
      - ".github/workflows/ai-worker-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: ai-worker
        run: python -m unittest discover -s tests -v
